[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "password-manager-lab"
version = "1.0.0"
description = "A simple encrypted password manager for a laboratory assignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=44.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
password-manager = "password_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["password_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["password_manager", "tests"]
